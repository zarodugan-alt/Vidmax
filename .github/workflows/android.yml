name: android-ci

on:
  push:
    branches: [main, arena/01a0b6a1-vidmax]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build + unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runners ship a preinstalled Android SDK (ANDROID_HOME set, licenses
      # accepted) — just make sure platform 34 + build-tools 34 are present.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APKs (ABI splits)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Lint (NewApi check per AC #3)
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee lint.log

      - name: Annotate errors
        if: failure()
        run: |
          for log in build.log test.log lint.log; do
            [ -f "$log" ] || continue
            grep -E "^e: file:|error: |FAILURE: |Execution failed for task" "$log" \
              | head -10 | while IFS= read -r line; do
                echo "::error::[${log}] ${line:0:600}"
              done
          done
          exit 0

      # Egress-restricted dev environment cannot fetch run logs from GitHub's blob
      # storage, so failures are mirrored to the ci-logs branch via the Contents API.
      - name: Publish failure logs (ci-logs branch)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -x
          # 1. Assemble the trimmed failure report.
          RUN_ID="${GITHUB_RUN_ID}"
          REPORT="/tmp/report.txt"
          {
            echo "CI failure report — run ${RUN_ID} (${GITHUB_SHA})"
            echo "=================================================="
            for log in build.log test.log lint.log; do
              if [ -f "$log" ]; then
                echo ""
                echo "########## ${log} — error lines ##########"
                grep -nE "^e: file:|error: |FAILURE: |What went wrong|Execution failed for task|Caused by:" "$log" || true
                echo ""
                echo "########## ${log} — tail 400 ##########"
                tail -n 400 "$log"
              fi
            done
          } > "$REPORT" 2>&1 || true
          wc -c "$REPORT"

          # 2. Ensure the ci-logs branch exists (point it at this commit).
          SHA="$(git rev-parse HEAD)"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs" \
            -d "{\"ref\": \"refs/heads/ci-logs\", \"sha\": \"${SHA}\"}" \
            | grep -q '"ref"' && echo "branch created" || echo "branch exists (or create failed — continuing)"

          # 3. Commit the report to ci-logs via the Contents API.
          python3 - "$REPORT" << 'PYEOF'
          import base64, json, os, sys, urllib.request
          path = sys.argv[1]
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["GITHUB_RUN_ID"]
          content = base64.b64encode(open(path, "rb").read()).decode()
          body = json.dumps({
              "message": f"CI failure logs — run {run_id} [skip ci]",
              "content": content,
              "branch": "ci-logs",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/logs/run-{run_id}.txt",
              data=body,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="PUT",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("contents-api status:", resp.status)
          except urllib.error.HTTPError as e:
              print("contents-api error:", e.code, e.read().decode()[:500])
              raise
          PYEOF
          touch /tmp/published

      - name: Report log-publish status
        if: always()
        run: |
          if [ -f /tmp/published ]; then
            echo "::notice::failure logs published to ci-logs branch"
          else
            echo "::error::failure logs were NOT published — check publish step"
          fi

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: comet-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build.log
            test.log
            lint.log
          retention-days: 14
          if-no-files-found: ignore
